<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마구간 카드 편집기</title>
<style>
  :root{
    --paper:#F2EFE8;
    --ink:#20241F;
    --hay:#C98A2C;
    --barn:#7A3B2E;
    --pine:#3A5A45;
    --line:#D8D2C2;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  header.top h1{
    font-family:Georgia,"Noto Serif KR",serif;
    font-size:28px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:13px;
    color:#5b5b52;
    max-width:420px;
    line-height:1.5;
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(320px,0.85fr);
    gap:26px;
  }
  @media (max-width: 860px){
    .layout{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px;
  }
  .panel + .panel{margin-top:18px;}
  .panel h2{
    font-size:14px;
    margin:0 0 12px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2 .dot{
    width:8px;height:8px;border-radius:50%;background:var(--hay);flex:none;
  }

  /* preview */
  .ratio-tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
  }
  .ratio-tabs button{
    flex:1;
    padding:8px 6px;
    font-size:13px;
    font-weight:600;
    background:transparent;
    border:1px solid var(--ink);
    border-radius:3px;
    cursor:pointer;
    color:var(--ink);
  }
  .ratio-tabs button.active{
    background:var(--ink);
    color:var(--paper);
  }
  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    background:repeating-conic-gradient(#eae5da 0% 25%, #f4f1ea 0% 50%) 50% / 18px 18px;
    border:1px solid var(--line);
    border-radius:3px;
    padding:16px;
    min-height:360px;
  }
  #stageCanvas{
    max-width:100%;
    max-height:520px;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    background:#fff;
    cursor:grab;
  }
  #stageCanvas:active{cursor:grabbing;}
  .stage-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    font-size:12px;
    color:#6b6b60;
  }
  .btn{
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    border-radius:3px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
  }
  .btn.accent{
    background:var(--hay);
    border-color:var(--hay);
    color:#241a05;
  }
  .btn.danger{
    background:var(--barn);
    border-color:var(--barn);
    color:#fff;
  }
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* controls */
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:#4c4c44;
    margin:14px 0 6px;
  }
  label:first-child{margin-top:0;}
  textarea, input[type=text], input[type=number], select{
    width:100%;
    padding:8px 9px;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  input[type=range]{width:100%;}
  input[type=color]{
    width:100%;height:34px;border:1px solid var(--line);border-radius:3px;padding:2px;background:#fff;
  }
  .imgpick{
    display:flex;
    gap:8px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .imgpick img{
    width:52px;height:52px;object-fit:cover;border-radius:3px;
    border:2px solid transparent;cursor:pointer;
  }
  .imgpick img.active{border-color:var(--hay);}
  .imgpick .upload{
    width:52px;height:52px;
    border:1px dashed #999;
    border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#666;cursor:pointer;text-align:center;
  }

  /* template list */
  .tpl-list{list-style:none;margin:0;padding:0;}
  .tpl-list li{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 6px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .tpl-list li:last-child{border-bottom:none;}
  .tpl-list .name{flex:1;font-weight:600;}
  .tpl-list .meta{font-size:11px;color:#8a8a7c;}
  .tpl-list button{
    font-size:11px;
    padding:4px 7px;
    border-radius:3px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
  }
  .empty-note{
    font-size:12px;color:#8a8a7c;padding:8px 2px;
  }

  .status{
    font-size:12px;
    padding:9px 10px;
    border-radius:3px;
    margin-top:10px;
    display:none;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .status.show{display:block;}
  .status.ok{background:#e7efe6;color:var(--pine);border:1px solid #bcd3b7;}
  .status.err{background:#f6e6e2;color:var(--barn);border:1px solid #e2bcae;}

  .preset-row{display:flex;gap:8px;align-items:center;}
  .preset-row select{flex:1;}

  .divider{height:1px;background:var(--line);margin:16px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>마구간 카드 편집기</h1>
    <div class="sub">사진과 문구를 얹어 1:1 · 4:5 · 9:16 카드를 만듭니다. 미리보기와 내려받은 파일은 같은 캔버스로 그려서 항상 일치합니다.</div>
  </header>

  <div class="layout">
    <!-- LEFT: preview -->
    <div>
      <div class="panel">
        <h2><span class="dot"></span>미리보기</h2>
        <div class="ratio-tabs" id="ratioTabs">
          <button data-ratio="1:1" class="active">1:1</button>
          <button data-ratio="4:5">4:5</button>
          <button data-ratio="9:16">9:16</button>
        </div>
        <div class="stage">
          <canvas id="stageCanvas"></canvas>
        </div>
        <div class="stage-foot">
          <span id="canvasSizeLabel"></span>
          <span>문구를 드래그해서 옮길 수 있어요</span>
        </div>
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn accent" id="downloadBtn">파일로 내려받기</button>
          <button class="btn secondary" id="resetPosBtn">문구 위치 초기화</button>
        </div>
        <div class="status" id="downloadStatus"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span>극단 입력 테스트 프리셋</h2>
        <div class="preset-row">
          <select id="presetSelect">
            <option value="">-- 테스트 문구 선택 --</option>
          </select>
          <button class="btn secondary" id="presetApply">적용</button>
        </div>
        <div class="empty-note">이 목록의 12개 문구를 하나씩 적용해서 미리보기·내려받기 결과를 검사표에 기록하세요 (T03-C14~C16).</div>
      </div>
    </div>

    <!-- RIGHT: controls -->
    <div>
      <div class="panel">
        <h2><span class="dot"></span>이미지</h2>
        <div class="imgpick" id="imgPick"></div>

        <label>문구</label>
        <textarea id="captionInput" placeholder="문구를 입력하세요 (비워두면 문구 없이 저장됩니다)"></textarea>

        <div class="row3">
          <div>
            <label>글자 크기</label>
            <input type="number" id="fontSize" value="56" min="10" max="240">
          </div>
          <div>
            <label>글자 색</label>
            <input type="color" id="fontColor" value="#ffffff">
          </div>
          <div>
            <label>정렬</label>
            <select id="textAlign">
              <option value="center">가운데</option>
              <option value="left">왼쪽</option>
              <option value="right">오른쪽</option>
            </select>
          </div>
        </div>

        <label>배경 밝기 보정 (문구 뒤 어둡게)</label>
        <input type="range" id="scrim" min="0" max="80" value="35">
      </div>

      <div class="panel">
        <h2><span class="dot"></span>템플릿 저장 목록</h2>
        <label>템플릿 이름</label>
        <input type="text" id="templateName" placeholder="예: 야근 인증샷">
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn" id="saveNewBtn">새 템플릿으로 저장</button>
          <button class="btn secondary" id="updateBtn">선택 항목 덮어쓰기</button>
        </div>
        <div class="divider"></div>
        <ul class="tpl-list" id="tplList"></ul>
        <div class="empty-note" id="tplEmptyNote">아직 저장된 템플릿이 없습니다. 위에서 새 템플릿으로 저장해 보세요.</div>
        <div class="status" id="tplStatus"></div>
      </div>

      <div class="panel">
        <h2><span class="dot"></span>JSON 가져오기 / 내보내기</h2>
        <div class="btn-row">
          <button class="btn secondary" id="exportBtn">전체 내보내기 (.json)</button>
          <button class="btn secondary" id="importBtn">파일에서 가져오기</button>
          <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
        </div>
        <label>또는 JSON을 직접 붙여넣기</label>
        <textarea id="jsonPaste" placeholder='[{"id":"...", "name":"...", ...}]' style="min-height:90px;font-family:monospace;font-size:11px;"></textarea>
        <div class="btn-row" style="margin-top:8px;">
          <button class="btn secondary" id="importPasteBtn">붙여넣은 JSON 가져오기</button>
        </div>
        <div class="status" id="jsonStatus"></div>
      </div>
    </div>
  </div>
</div>

  // ---------- 유틸 ----------
  function el(id){ return document.getElementById(id); }
  function uid(){ return "t_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }
  function showStatus(node, msg, ok){

  function loadImage(src){
    return new Promise((resolve, reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = reject;
      im.src = src;
    });
  }

  // 캔버스 폭 대비 자동 줄바꿈 (수동 \n도 존중)
  function wrapText(context, text, maxWidth){
    if(!text) return [];
    const paragraphs = text.split("\n");
    const lines = [];
    paragraphs.forEach(p=>{
      if(p === ""){ lines.push(""); return; }
      const words = p.split(" ");
      let current = "";
      words.forEach(word=>{
        // 공백 없는 매우 긴 단어(예: 붙어있는 한글 문장)는 글자 단위로도 쪼갠다
        const test = current ? current + " " + word : word;
        if(context.measureText(test).width <= maxWidth){
          current = test;
        } else {
          if(current) lines.push(current);
          if(context.measureText(word).width > maxWidth){
            let chunk = "";
            for(const ch of word){
              const t2 = chunk + ch;
              if(context.measureText(t2).width > maxWidth && chunk){
                lines.push(chunk);
                chunk = ch;
              } else {
                chunk = t2;
              }
            }
            current = chunk;
          } else {
            current = word;
          }
        }
      });
      lines.push(current);
    });
    return lines;
  }

  // ---------- 렌더링 (미리보기 = 내려받기, 동일 함수) ----------
  async function render(){
    const {w,h} = RATIOS[state.ratio];
    canvas.width = w;
    canvas.height = h;
    el("canvasSizeLabel").textContent = state.ratio + "  ·  " + w + " × " + h + "px";

    // 폰트 준비 대기 (저장 시 글자 위치가 달라지는 문제 방지)
    if(document.fonts && document.fonts.ready){
      try{ await document.fonts.ready; }catch(e){}
    }

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,w,h);

    if(loadedImageEl){
      // contain 방식: 잘림 없이 비율 유지, 남는 곳은 흰 배경
      const ir = loadedImageEl.width / loadedImageEl.height;
      const cr = w / h;
      let dw, dh, dx, dy;
      if(ir > cr){
        dw = w; dh = w / ir; dx = 0; dy = (h - dh)/2;
      } else {
        dh = h; dw = h * ir; dy = 0; dx = (w - dw)/2;
      }
      ctx.drawImage(loadedImageEl, dx, dy, dw, dh);
    }

    // 문구
    const caption = state.caption || "";
    if(caption.trim() !== "" || caption.includes("\n") === false && caption !== ""){
      // (빈 문구는 완전히 건너뛴다 — 극단 입력 06)
    }
    if(caption !== "" && caption.trim() !== "" || /\S/.test(caption)){
      const fontPx = state.fontSize;
      ctx.font = fontPx + "px 'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif";
      ctx.textBaseline = "alphabetic";
      const maxWidth = w * 0.86;
      const lines = wrapText(ctx, caption, maxWidth);
      const lineHeight = fontPx * 1.32;
      const blockHeight = lines.length * lineHeight;
      const cx = w * state.textX;
      const cyTop = h * state.textY - blockHeight/2;

      if(state.scrim > 0 && lines.length){
        ctx.fillStyle = "rgba(0,0,0," + (state.scrim/100) + ")";
        const pad = fontPx * 0.4;
        ctx.fillRect(0, cyTop - pad, w, blockHeight + pad*2);
      }

      ctx.fillStyle = state.fontColor;
      ctx.textAlign = state.align;
      let anchorX = cx;
      if(state.align === "left") anchorX = w*0.07;
      if(state.align === "right") anchorX = w*0.93;

      lines.forEach((line, i)=>{
        const y = cyTop + lineHeight*(i+1) - lineHeight*0.28;
        ctx.fillText(line, anchorX, y);
      });
    }
  }

  // ---------- 이미지 선택 UI ----------
  function buildImagePicker(){
    const wrap = el("imgPick");
    wrap.innerHTML = "";
    DEFAULT_IMAGES.forEach(img=>{
      const el2 = document.createElement("img");
      el2.src = img.src;
      el2.title = img.label;
      el2.dataset.key = img.id;
      if(state.imageKey === img.id) el2.className = "active";
      el2.addEventListener("click", ()=>selectImage(img.id, img.src));
      wrap.appendChild(el2);
    });
    Object.keys(customImages).forEach(key=>{
      const el2 = document.createElement("img");
      el2.src = customImages[key];
      el2.title = "업로드한 이미지";
      el2.dataset.key = key;
      if(state.imageKey === key) el2.className = "active";
      el2.addEventListener("click", ()=>selectImage(key, customImages[key]));
      wrap.appendChild(el2);
    });
    const uploadBtn = document.createElement("label");
    uploadBtn.className = "upload";
    uploadBtn.textContent = "업로드";
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.style.display = "none";
    input.addEventListener("change", handleUpload);
    uploadBtn.appendChild(input);
    wrap.appendChild(uploadBtn);
  }

  function handleUpload(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const key = "custom_" + Date.now();
      customImages[key] = reader.result;
      buildImagePicker();
      selectImage(key, reader.result);
    };
    reader.readAsDataURL(file);
  }

  async function selectImage(key, src){
    state.imageKey = key;
    state.imageSrc = src;
    buildImagePicker();
    try{
      loadedImageEl = await loadImage(src);
    }catch(e){
      loadedImageEl = null;
    }
    render();
  }

  // ---------- 컨트롤 바인딩 ----------
  function bindControls(){
    document.querySelectorAll("#ratioTabs button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll("#ratioTabs button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        state.ratio = btn.dataset.ratio;
        render();
      });
    });

    el("captionInput").addEventListener("input", (e)=>{
      state.caption = e.target.value;
      render();
    });
    el("fontSize").addEventListener("input", (e)=>{
      state.fontSize = parseInt(e.target.value || "56", 10);
      render();
    });
    el("fontColor").addEventListener("input", (e)=>{
      state.fontColor = e.target.value;
      render();
    });
    el("textAlign").addEventListener("change", (e)=>{
      state.align = e.target.value;
      render();
    });
    el("scrim").addEventListener("input", (e)=>{
      state.scrim = parseInt(e.target.value, 10);
      render();
    });
    el("resetPosBtn").addEventListener("click", ()=>{
      state.textX = 0.5; state.textY = 0.82;
      render();
    });

    // 캔버스 드래그로 문구 위치 옮기기
    let dragging = false;
    function posFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return {x: cx/rect.width, y: cy/rect.height};
    }
    canvas.addEventListener("mousedown", (e)=>{ dragging = true; });
    window.addEventListener("mouseup", ()=>{ dragging = false; });
    window.addEventListener("mousemove", (e)=>{
      if(!dragging) return;
      const p = posFromEvent(e);
      state.textX = Math.min(1, Math.max(0, p.x));
      state.textY = Math.min(1, Math.max(0, p.y));
      render();
    });

    el("downloadBtn").addEventListener("click", downloadCurrent);

    // 프리셋
    const sel = el("presetSelect");
    EXTREME_PRESETS.forEach((p, i)=>{
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = p.name;
      sel.appendChild(opt);
    });
    el("presetApply").addEventListener("click", ()=>{
      const idx = sel.value;
      if(idx === "") return;
      const preset = EXTREME_PRESETS[idx];
      state.caption = preset.text;
      el("captionInput").value = preset.text;
      render();
    });

    // 템플릿 저장/불러오기
    el("saveNewBtn").addEventListener("click", saveAsNewTemplate);
    el("updateBtn").addEventListener("click", updateSelectedTemplate);

    // JSON
    el("exportBtn").addEventListener("click", exportJSON);
    el("importBtn").addEventListener("click", ()=>el("importFile").click());
    el("importFile").addEventListener("change", importJSONFile);
    el("importPasteBtn").addEventListener("click", importJSONPaste);
  }

  async function downloadCurrent(){
    await render();
    canvas.toBlob(blob=>{
      if(!blob){
        showStatus(el("downloadStatus"), "내려받기에 실패했습니다. 다시 시도해 주세요.", false);
        return;
      }
      const a = document.createElement("a");
      const ratioLabel = state.ratio.replace(":","x");
      a.href = URL.createObjectURL(blob);
      a.download = "card_" + ratioLabel + "_" + Date.now() + ".png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      showStatus(el("downloadStatus"), state.ratio + " 비율(" + canvas.width + "×" + canvas.height + "px)로 내려받았습니다. 미리보기와 동일한 캔버스로 만들어졌습니다.", true);
    }, "image/png");
  }

  // ---------- 템플릿 CRUD ----------
  function templateFromState(name){
    return {
      id: uid(),
      name: name,
      ratio: state.ratio,
      imageKey: state.imageKey,
      imageSrc: state.imageSrc,
      caption: state.caption,
      fontSize: state.fontSize,
      fontColor: state.fontColor,
      align: state.align,
      scrim: state.scrim,
      textX: state.textX,
      textY: state.textY,
      updatedAt: new Date().toISOString()
    };
  }

  function validateTemplate(t){
    if(typeof t !== "object" || t === null) return "항목이 객체가 아닙니다.";
    if(!t.id || typeof t.id !== "string") return "id가 없습니다.";
    if(!t.name || typeof t.name !== "string") return "name이 없습니다.";
    if(!t.ratio || !RATIOS[t.ratio]) return "ratio 값이 올바르지 않습니다 (1:1/4:5/9:16).";
    if(typeof t.imageSrc !== "string") return "imageSrc가 없습니다.";
    if(typeof t.caption !== "string") return "caption 필드가 없습니다.";
    return null;
  }

  async function persistTemplates(){
    try{
      await window.storage.set("templates", JSON.stringify(templates), false);
    }catch(e){
      console.error("저장 실패", e);
    }
  }

  function renderTemplateList(){
    const ul = el("tplList");
    ul.innerHTML = "";
    el("tplEmptyNote").style.display = templates.length ? "none" : "block";
    templates.forEach(t=>{
      const li = document.createElement("li");
      const nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = t.name;
      const metaSpan = document.createElement("span");
      metaSpan.className = "meta";
      metaSpan.textContent = t.ratio;

      const loadBtn = document.createElement("button");
      loadBtn.textContent = "불러오기";
      loadBtn.addEventListener("click", ()=>loadTemplate(t.id));

      const delBtn = document.createElement("button");
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", ()=>deleteTemplate(t.id));

      li.appendChild(nameSpan);
      li.appendChild(metaSpan);
      li.appendChild(loadBtn);
      li.appendChild(delBtn);
      if(t.id === selectedTemplateId){
        li.style.background = "#f6f0e2";
      }
      ul.appendChild(li);
    });
  }

  async function saveAsNewTemplate(){
    const nameInput = el("templateName");
    const name = nameInput.value.trim();
    if(!name){
      showStatus(el("tplStatus"), "템플릿 이름을 입력해 주세요.", false);
      return;
    }
    const t = templateFromState(name);
    templates.push(t);
    selectedTemplateId = t.id;
    await persistTemplates();
    renderTemplateList();
    showStatus(el("tplStatus"), "\"" + name + "\" 템플릿을 저장했습니다. (총 " + templates.length + "개)", true);
  }

  async function updateSelectedTemplate(){
    if(!selectedTemplateId){
      showStatus(el("tplStatus"), "먼저 목록에서 템플릿을 불러온 뒤 수정해 주세요.", false);
      return;
    }
    const idx = templates.findIndex(t=>t.id === selectedTemplateId);
    if(idx === -1){
      showStatus(el("tplStatus"), "선택한 템플릿을 찾을 수 없습니다.", false);
      return;
    }
    const name = el("templateName").value.trim() || templates[idx].name;
    templates[idx] = Object.assign({}, templateFromState(name), {id: selectedTemplateId});
    await persistTemplates();
    renderTemplateList();
    showStatus(el("tplStatus"), "\"" + name + "\" 템플릿을 덮어썼습니다.", true);
  }

  async function loadTemplate(id){
    const t = templates.find(x=>x.id === id);
    if(!t) return;
    selectedTemplateId = id;
    state.ratio = t.ratio;
    state.imageKey = t.imageKey;
    state.imageSrc = t.imageSrc;
    state.caption = t.caption;
    state.fontSize = t.fontSize;
    state.fontColor = t.fontColor;
    state.align = t.align;
    state.scrim = t.scrim;
    state.textX = t.textX;
    state.textY = t.textY;

    document.querySelectorAll("#ratioTabs button").forEach(b=>{
      b.classList.toggle("active", b.dataset.ratio === state.ratio);
    });
    el("captionInput").value = state.caption;
    el("fontSize").value = state.fontSize;
    el("fontColor").value = state.fontColor;
    el("textAlign").value = state.align;
    el("scrim").value = state.scrim;
    el("templateName").value = t.name;
    if(!customImages[t.imageKey] && !DEFAULT_IMAGES.find(d=>d.id===t.imageKey)){
      customImages[t.imageKey] = t.imageSrc;
    }
    buildImagePicker();
    try{ loadedImageEl = await loadImage(t.imageSrc); }catch(e){ loadedImageEl = null; }
    renderTemplateList();
    await render();
    showStatus(el("tplStatus"), "\"" + t.name + "\" 템플릿을 불러왔습니다.", true);
  }

  async function deleteTemplate(id){
    const before = templates.length;
    templates = templates.filter(t=>t.id !== id);
    if(selectedTemplateId === id) selectedTemplateId = null;
    await persistTemplates();
    renderTemplateList();
    showStatus(el("tplStatus"), "삭제했습니다. (" + before + "개 → " + templates.length + "개)", true);
  }

  // ---------- JSON 가져오기 / 내보내기 ----------
  function exportJSON(){
    const blob = new Blob([JSON.stringify(templates, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "templates_" + Date.now() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    showStatus(el("jsonStatus"), templates.length + "개 템플릿을 내보냈습니다.", true);
  }

  async function applyImportedJSON(text, statusNode){
    const before = templates.length;
    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      showStatus(statusNode, "JSON 문법이 올바르지 않아 가져오기를 거부했습니다. 기존 " + before + "개 템플릿은 그대로 유지됩니다.\n(" + e.message + ")", false);
      return;
    }
    if(!Array.isArray(parsed)){
      showStatus(statusNode, "최상위 값이 배열이 아니어서 가져오기를 거부했습니다. 기존 " + before + "개 템플릿은 그대로 유지됩니다.", false);
      return;
    }
    for(let i=0;i<parsed.length;i++){
      const err = validateTemplate(parsed[i]);
      if(err){
        showStatus(statusNode, (i+1) + "번째 항목이 유효하지 않아 가져오기를 거부했습니다: " + err + "\n기존 " + before + "개 템플릿은 그대로 유지됩니다.", false);
        return;
      }
    }
    // 전체 검증 통과 후에만 반영
    templates = parsed;
    selectedTemplateId = null;
    await persistTemplates();
    renderTemplateList();
    showStatus(statusNode, "가져오기 성공: " + before + "개 → " + templates.length + "개.", true);
  }

  function importJSONFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>applyImportedJSON(reader.result, el("jsonStatus"));
    reader.readAsText(file);
    e.target.value = "";
  }

  function importJSONPaste(){
    const text = el("jsonPaste").value;
    if(!text.trim()){
      showStatus(el("jsonStatus"), "붙여넣은 내용이 없습니다.", false);
      return;
    }
    applyImportedJSON(text, el("jsonStatus"));
  }

  // ---------- 초기화 ----------
  async function init(){
    buildImagePicker();
    try{
      loadedImageEl = await loadImage(state.imageSrc);
    }catch(e){ loadedImageEl = null; }
    bindControls();
    el("captionInput").value = state.caption;

    try{
      const res = await window.storage.get("templates", false);
      if(res && res.value){
        templates = JSON.parse(res.value);
      }
    }catch(e){
      templates = [];
    }
    renderTemplateList();
    await render();
  }

  init();
})();
</script>
</body>
</html>
